<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchBook — Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Source+Serif+4&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>

    <div id="site-header"></div>
    <script src="js/header.js"></script>

    <main class="page">
        <div class="login-box">
            <form id="login-form">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" placeholder="jane@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>

                <button type="submit">Log In</button>
            </form>
        </div>
        <div class="login-box">
            <form id="signup-form">
                <label>Don't have an account?</label>
                <button type="submit" class="signup">Sign Up</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">Elizabethtown College 2026-2027 || Teddy Bazyar ~ Ryder Paulus ~ Chase Dornblaser ||
        CS 310 Web Development</footer>

    <script src="scripts/login.js"></script>
</body>
</html>
