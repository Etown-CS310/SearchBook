<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchBook — Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Source+Serif+4&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>

    <div id="site-header"></div>
    <script src="../js/header.js"></script>

    <main class="page">
        <div class="login-box">
            <!-- js/signup.js changes this heading for the "finish sign-up" (Google) mode. -->
            <h2 id="signup-heading">Create an account</h2>
            <p id="message" class="message" hidden></p>

            <form id="signup-form" novalidate>
                <label for="username">Username (3-20 letters, numbers, _)</label>
                <input type="text" id="username" name="username" placeholder="janedoe" autocomplete="username"
                    maxlength="20" required>

                <!-- Hidden in finish mode: a Google account already has an email and no password. -->
                <div id="credential-fields" class="credential-fields">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email" required>

                    <label for="password">Password (at least 6 characters)</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password"
                        minlength="6" required>

                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••"
                        autocomplete="new-password" required>
                </div>

                <button type="submit" id="signup-btn">Sign Up</button>
            </form>

            <button type="button" id="google-btn">Sign up with Google</button>
        </div>
    </main>

    <footer class="site-footer">Elizabethtown College 2026-2027 || Teddy Bazyar ~ Ryder Paulus ~ Chase Dornblaser ||
        CS 310 Web Development</footer>

    <script type="module" src="../js/signup.js"></script>

</body>
</html>
